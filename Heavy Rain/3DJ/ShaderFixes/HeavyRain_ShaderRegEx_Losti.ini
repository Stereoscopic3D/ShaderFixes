;********************************************************ShaderRegex_HALO2***************************************************************
;ShaderRegex_HALO2
[ShaderRegex_HALO2]
shader_model = vs_4_0 vs_5_0
temps = stereo tmp1 tmp2
;checktextureoverride = oD
x111 = oD
[ShaderRegex_HALO2.Pattern]
(?P<section1>
\s*mov o\d+\.[xyzw]{2}, v\d+\.[xyzw]{4}\n
\s*mov o\d+\.[xyzw]{4}, v\d+\.[xyzw]{4}\n
\s*mov o\d+\.[xyzw]{3}, v\d+\.[xyzw]{4}\n
\s*dp4 r\d+\.[xyzw]{1}, v\d+\.[xyzw]{4}, cb\d+\[\d+\]\.[xyzw]{4}\n
\s*mul o\d+\.[xyzw]{1}, r\d+\.[xyzw]{1}, l\(0\.000100\)\n
\s*add r\d+\.[xyzw]{1}, -r\d+\.[xyzw]{1}, cb\d+\[\d+\]\.[xyzw]{1}\n
\s*mul_sat o\d+\.[xyzw]{1}, r\d+\.[xyzw]{1}, cb\d+\[\d+\]\.[xyzw]{1}\n
\s*mov o\d+\.[xyzw]{3}, cb\d+\[\d+\]\.[xyzw]{4}\n
\s*mov o\d+\.[xyzw]{3}, v\d+\.[xyzw]{4}\n
)
(?s)(?P<rest>.*)\n
(?P<section2>
\s*mov o\d+\.[xyzw]{3}, (?P<FIXREG0>r\d+)\.[xyzw]{4}\n
\s*mov o\d+\.[xyzw]{3}, (?P=FIXREG0)\.[xyzw]{4}\n
)
(?s)(?P<rest2>.*)\n
(?P<section3>
\s*dp4 o\d+\.[xyzw]{1}, r\d+\.[xyzw]{4}, cb\d+\[\d+\]\.[xyzw]{4}\n
\s*dp4 o\d+\.[xyzw]{1}, r\d+\.[xyzw]{4}, cb\d+\[\d+\]\.[xyzw]{4}\n
\s*dp4 o\d+\.[xyzw]{1}, r\d+\.[xyzw]{4}, cb\d+\[\d+\]\.[xyzw]{4}\n
\s*dp4 o\d+\.[xyzw]{1}, r\d+\.[xyzw]{4}, cb\d+\[\d+\]\.[xyzw]{4}\n
\s*mov o\d+\.[xyzw]{4}, l\(1\.000000,1\.000000,1\.000000,1\.000000\)\n
)
[ShaderRegex_HALO2.Pattern.Replace]
\n
${section1}\n
//skip shader catched another time\n
${rest}\n

ld_indexable(texture2d)(float,float,float,float) ${stereo}.xyzw, l(0, 0, 0, 0), t125.xyzw\n
add ${stereo}.w, ${FIXREG0}.w, -${stereo}.y\n
mul ${stereo}.w, ${stereo}.w, ${stereo}.x\n
add ${FIXREG0}.x, ${FIXREG0}.x, ${stereo}.w\n
${section2}\n
${rest2}\n
${section3}\n
[ShaderRegex_HALO2.InsertDeclarations]
dcl_resource_texture2d (float,float,float,float) t125
dcl_resource_texture1d (float,float,float,float) t120
dcl_constantbuffer cb12[4], immediateIndexed
;********************************************************ShaderRegex_HALO2***************************************************************
;
;



;********************************************************ShaderRegex_HALO***************************************************************
;ShaderRegex_HALO
[ShaderRegex_HALO]
shader_model = vs_4_0 vs_5_0
temps = stereo tmp1 tmp2
;checktextureoverride = oD
x111 = oD
[ShaderRegex_HALO.Pattern]
(?P<section0>
\s*mov o\d+\.[xyzw]{4}, v\d+\.[xyzw]{4}\n
\s*mov o\d+\.[xyzw]{3}, l\(0,0,0,0\)\n
)
(?s)(?P<rest>.*)
(?P<section1>
\s*dp4 (?P<FIXREG1>r\d+)\.[xyzw], (?P<VREG0>r\d+)\.[xyzw]{4}, cb(?P<CBNR0>\d+)\[\d+\]\.[xyzw]{4}\n
)
(?s)(?P<rest2>.*)
(?P<section4>
\s*dp4 (?P=VREG0)\.[xyzw], (?P=VREG0)\.xyzw, cb(?P=CBNR0)\[1\]\.[xyzw]{4}\n
)
(?P<section2>
\s*mov o\d+\.[xyzw]{3}, (?P=FIXREG1)\.[xyzw]{4}\n
)
(?P<section3>
\s*mov o\d+\.[xyzw]{3}, (?P=FIXREG1)\.[xyzw]{4}\n
)
(?P<section5>
\s*mov o\d+\.[xyzw]{1}, -(?P=VREG0)\.[xyzw]\n
\s*mov o\d+\.[xyzw]{1}, (?P=VREG0)\.[xyzw]\n
\s*mov o\d+\.[xyzw]{4}, l\(\d+\.\d+,\d+\.\d+,\d+\.\d+,\d+\.\d+\)\n
)
[ShaderRegex_HALO.Pattern.Replace]
\n
${section0}\n
//skip shader catched another time\n
${rest}\n
//skip shader catched another time\n
${section1}\n
//skip shader catched another time\n
${rest2}\n
//skip shader catched another time\n
${section4}\n
ld_indexable(texture1d)(float,float,float,float) ${tmp1}.xyzw, l(111, 0, 0, 0), t120.xyzw\n
ld_indexable(texture2d)(float,float,float,float) ${stereo}.xyzw, l(0, 0, 0, 0), t125.xyzw\n
eq ${tmp1}.x, ${tmp1}.x, l(0.0)\n\n
if_z ${tmp1}.x\n
${section3}\n
add ${stereo}.w, ${FIXREG1}.w, -${stereo}.y\n
mul ${stereo}.w, ${stereo}.w, ${stereo}.x\n
add ${FIXREG1}.x, ${FIXREG1}.x, ${stereo}.w\n
//skip shader catched another time\n
${section2}\n
endif\n
if_nz ${tmp1}.x\n
add ${stereo}.w, ${FIXREG1}.w, -${stereo}.y\n
mul ${stereo}.w, ${stereo}.w, ${stereo}.x\n
add ${FIXREG1}.x, ${FIXREG1}.x, ${stereo}.w\n
${section2}\n
//skip shader catched another time\n
${section3}\n
endif\n
//skip shader catched another time\n
${section5}\n
[ShaderRegex_HALO.InsertDeclarations]
dcl_resource_texture2d (float,float,float,float) t125
dcl_resource_texture1d (float,float,float,float) t120
dcl_constantbuffer cb12[4], immediateIndexed
;********************************************************ShaderRegex_HALO***************************************************************
;
