
[ShaderRegex_Shadows]
shader_model = ps_4_0 ps_5_0
temps = stereo

[ShaderRegex_Shadows.Pattern]
(?P<post>dp4 r\d?.w, cb2\[3\].xyzw, (?P<pos1>r\d?).xyzw\n\s*dp4 r\d?.x, cb2\[0\].xyzw, r\d?.xyzw)

[ShaderRegex_Shadows.Pattern.Replace]
\n
//--shadows fix--\n
ld_indexable(texture2d)(float,float,float,float) ${stereo}.xyzw, l(0, 0, 0, 0), t125.xyzw\n
add ${stereo}.w, ${pos1}.z, -${stereo}.y\n
mul ${stereo}.w, ${stereo}.x, ${stereo}.w\n
mul ${stereo}.w, ${stereo}.w, cb2[11].x\n
add ${pos1}.x, ${pos1}.x, -${stereo}.w\n
\n
${post}

[ShaderRegex_Shadows.InsertDeclarations]
dcl_resource_texture2d (float,float,float,float) t125