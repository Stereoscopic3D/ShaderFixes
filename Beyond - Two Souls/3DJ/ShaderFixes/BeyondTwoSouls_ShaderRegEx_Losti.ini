;*********************************************************************************************************************************
;********************************************BeyondTwoSouls 3D-Vision Fix by Losti****************************************************
;*********************************************************************************************************************************
;
;****************************************************Shader-RegEx Setup***********************************************************
;
;
;********************************************************PS-Shadows-1*************************************************************
;PSShadows1-LOSTI
[ShaderRegexPSShadows1LOSTI]
shader_model = ps_4_0 ps_5_0
temps = stereo tmp1
[ShaderRegexPSShadows1LOSTI.Pattern]
(?P<section1>
\s*mul (?P<REG2X>r\d+)\.(?P<REG2SWIZZLEX>[xyzw]{1})[xyzw]{1}, r\d+\.[xyzw]{4}, r\d+\.[xyzw]{4}\n
\s*mul (?P=REG2X)\.(?P<REG2SWIZZLEZ>[xyzw]{1}), r\d+\.[xyzw]{1}, cb0\[25\]\.z\n
)
[ShaderRegexPSShadows1LOSTI.Pattern.Replace]
\n
${section1}\n
//ShaderRegEx - Pattern 1 - PS-Shadows_1 by Losti START\n
ld_indexable(texture2d)(float,float,float,float) ${stereo}.xyzw, l(0, 0, 0, 0), t125.xyzw\n
add ${stereo}.w, -${REG2X}.${REG2SWIZZLEZ}, -${stereo}.y\n
mul ${stereo}.w, ${stereo}.w, ${stereo}.x\n
div ${tmp1}.x, -cb0[25].x, cb0[25].z\n
mul ${stereo}.w, ${stereo}.w, ${tmp1}.x\n
add ${REG2X}.${REG2SWIZZLEX}, ${REG2X}.${REG2SWIZZLEX}, -${stereo}.w\n
//ShaderRegEx - Pattern 1 - PS-Shadows_1 by Losti END\n\n
[ShaderRegexPSShadows1LOSTI.InsertDeclarations]
dcl_resource_texture2d (float,float,float,float) t125
;********************************************************PS-Shadows-1***************************************************************
;
;
;********************************************************PS-Shadows-2*************************************************************
;PSShadows2-LOSTI
[ShaderRegexPSShadows2LOSTI]
shader_model = ps_4_0 ps_5_0
temps = stereo tmp1
[ShaderRegexPSShadows2LOSTI.Pattern]
(?P<section1>
\s*mul (?P<REG2X>r\d+)\.(?P<REG2SWIZZLEZ>[xyzw]{1}), r\d+\.[xyzw]{1}, cb0\[25\]\.z\n
\s*mul (?P=REG2X)\.(?P<REG2SWIZZLEX>[xyzw]{1})[xyzw]{1}, r\d+\.[xyzw]{4}, r\d+\.[xyzw]{4}\n
)
[ShaderRegexPSShadows2LOSTI.Pattern.Replace]
\n
${section1}\n
//ShaderRegEx - Pattern 2 - PS-Shadows_2 by Losti START\n
ld_indexable(texture2d)(float,float,float,float) ${stereo}.xyzw, l(0, 0, 0, 0), t125.xyzw\n
add ${stereo}.w, -${REG2X}.${REG2SWIZZLEZ}, -${stereo}.y\n
mul ${stereo}.w, ${stereo}.w, ${stereo}.x\n
div ${tmp1}.x, -cb0[25].x, cb0[25].z\n
mul ${stereo}.w, ${stereo}.w, ${tmp1}.x\n
add ${REG2X}.${REG2SWIZZLEX}, ${REG2X}.${REG2SWIZZLEX}, -${stereo}.w\n
//ShaderRegEx - Pattern 2 - PS-Shadows_2 by Losti END\n\n
[ShaderRegexPSShadows2LOSTI.InsertDeclarations]
dcl_resource_texture2d (float,float,float,float) t125
;********************************************************PS-Shadows-2***************************************************************
;
;
;********************************************************PS-Shadows-3*************************************************************
;PSShadows3-LOSTI
[ShaderRegexPSShadows3LOSTI]
shader_model = ps_4_0 ps_5_0
temps = stereo tmp1
[ShaderRegexPSShadows3LOSTI.Pattern]
(?P<section1>
\s*mul r\d+\.[xyzw]{1}, r\d+\.[xyzw]{1}, cb0\[25\]\.z\n
)
(?P<section2>
\s*mul r\d+\.([xyzw]{3}|[xyzw]{4}), r\d+\.[xyzw]{4}, cb0\[12\]\.[xyzw]{4}\n
\s*mad r\d+\.([xyzw]{3}|[xyzw]{4}), cb0\[11\]\.[xyzw]{4}, (?P<FIXREG0Z>r\d+)\.(?P<FIXSWIZZz>[xyzw]{1})(?P=FIXSWIZZz)(?P=FIXSWIZZz)(?P=FIXSWIZZz), r\d+\.[xyzw]{4}\n
\s*mad r\d+\.([xyzw]{3}|[xyzw]{4}), cb0\[13\]\.[xyzw]{4}, (?P<FIXREG1X>r\d+)\.(?P<FIXSWIZZx>[xyzw]{1})(?P=FIXSWIZZx)(?P=FIXSWIZZx)(?P=FIXSWIZZx), r\d+\.[xyzw]{4}\n
\s*add r\d+\.([xyzw]{3}|[xyzw]{4}), r\d+\.[xyzw]{4}, cb0\[14\]\.[xyzw]{4}\n
)
[ShaderRegexPSShadows3LOSTI.Pattern.Replace]
\n
${section1}\n
//ShaderRegEx - Pattern 3 - PS-Shadows_3 by Losti START\n
ld_indexable(texture2d)(float,float,float,float) ${stereo}.xyzw, l(0, 0, 0, 0), t125.xyzw\n
add ${stereo}.w, -${FIXREG1X}.${FIXSWIZZx}, -${stereo}.y\n
mul ${stereo}.w, ${stereo}.w, ${stereo}.x\n
div ${tmp1}.x, -cb0[25].x, cb0[25].z\n
mul ${stereo}.w, ${stereo}.w, ${tmp1}.x\n
add ${FIXREG0Z}.${FIXSWIZZz}, ${FIXREG0Z}.${FIXSWIZZz}, -${stereo}.w\n
//ShaderRegEx - Pattern 3 - PS-Shadows_3 by Losti END\n\n
${section2}
[ShaderRegexPSShadows3LOSTI.InsertDeclarations]
dcl_resource_texture2d (float,float,float,float) t125
;********************************************************PS-Shadows-3***************************************************************
;
;
;********************************************************PS-Shadows-4*************************************************************
;PSShadows4-LOSTI
[ShaderRegexPSShadows4LOSTI]
shader_model = ps_4_0 ps_5_0
temps = stereo tmp1
ps-cb13=ResourceGetCB0fromVS
[ShaderRegexPSShadows4LOSTI.Pattern]
(?P<section1>
\s*mul r\d+\.([xyzw]{3}|[xyzw]{4}), r\d+\.[xyzw]{4}, v\d+\.[xyzw]{4}\n
)
(?P<section2>
\s*mul r\d+\.([xyzw]{3}|[xyzw]{4}), r\d+\.[xyzw]{4}, cb0\[2\]\.[xyzw]{4}\n
\s*mad r\d+\.([xyzw]{3}|[xyzw]{4}), cb0\[1\]\.[xyzw]{4}, (?P<FIXREG0Z>r\d+)\.(?P<FIXSWIZZz>[xyzw]{1})(?P=FIXSWIZZz)(?P=FIXSWIZZz)(?P=FIXSWIZZz), r\d+\.[xyzw]{4}\n
\s*mad r\d+\.([xyzw]{3}|[xyzw]{4}), cb0\[3\]\.[xyzw]{4}, (?P<FIXREG1X>r\d+)\.(?P<FIXSWIZZx>[xyzw]{1})(?P=FIXSWIZZx)(?P=FIXSWIZZx)(?P=FIXSWIZZx), r\d+\.[xyzw]{4}\n
\s*add r\d+\.([xyzw]{3}|[xyzw]{4}), r\d+\.[xyzw]{4}, cb0\[4\]\.[xyzw]{4}\n
\s*mul r\d+\.[xyzw]{1}, r\d+\.[xyzw]{1}, cb0\[6\]\.y\n
)
[ShaderRegexPSShadows4LOSTI.Pattern.Replace]
\n
${section1}\n
//ShaderRegEx - Pattern 4 - PS-Shadows_4 by Losti START\n
ld_indexable(texture2d)(float,float,float,float) ${stereo}.xyzw, l(0, 0, 0, 0), t125.xyzw\n
//using CB0[25] from PS, if its not zero\n
;ieq ${tmp1}.y, cb0[25].z, l(0.0000000)\n
;if_z ${tmp1}.y\n
;add ${stereo}.w, -${FIXREG1X}.${FIXSWIZZx}, -${stereo}.y\n
;mul ${stereo}.w, ${stereo}.w, ${stereo}.x\n
;div ${tmp1}.x, -cb0[25].x, cb0[25].z\n
;mul ${stereo}.w, ${stereo}.w, ${tmp1}.x\n
;add ${FIXREG0Z}.${FIXSWIZZz}, ${FIXREG0Z}.${FIXSWIZZz}, -${stereo}.w\n
;endif\n
;//if CB0[25]=0 its using the CB0[1] from VS\n
;if_nz ${tmp1}.y\n
add ${stereo}.w, -${FIXREG1X}.${FIXSWIZZx}, -${stereo}.y\n
mul ${stereo}.w, ${stereo}.w, ${stereo}.x\n
div ${tmp1}.x, -cb13[1].x, cb13[1].z\n
mul ${stereo}.w, ${stereo}.w, ${tmp1}.x\n
add ${FIXREG0Z}.${FIXSWIZZz}, ${FIXREG0Z}.${FIXSWIZZz}, -${stereo}.w\n
;endif\n
//ShaderRegEx - Pattern 4 - PS-Shadows_4 by Losti END\n\n
${section2}
[ShaderRegexPSShadows4LOSTI.InsertDeclarations]
dcl_constantbuffer cb13[4], immediateIndexed
dcl_resource_texture2d (float,float,float,float) t125
;********************************************************PS-Shadows-4***************************************************************
;
;
;********************************************************PS-Shadows-5*************************************************************
;PSShadows5-LOSTI
[ShaderRegexPSShadows5LOSTI]
shader_model = ps_4_0 ps_5_0
temps = stereo tmp1
ps-cb13=ResourceGetCB0fromVS
[ShaderRegexPSShadows5LOSTI.Pattern]

(?P<section1>
\s*mul r\d+\.([xyzw]{3}|[xyzw]{4}), r\d+\.[xyzw]{4}, v\d+\.[xyzw]{4}\n
)
(?s)(?P<rest>.*)
(?P<section2>
\s*mul r\d+\.([xyzw]{3}|[xyzw]{4}), r\d+\.[xyzw]{4}, cb0\[8\]\.[xyzw]{4}\n
\s*mad r\d+\.([xyzw]{3}|[xyzw]{4}), cb0\[7\]\.[xyzw]{4}, (?P<FIXREG0Z>r\d+)\.(?P<FIXSWIZZz>[xyzw]{1})(?P=FIXSWIZZz)(?P=FIXSWIZZz)(?P=FIXSWIZZz), r\d+\.[xyzw]{4}\n
\s*mad r\d+\.([xyzw]{3}|[xyzw]{4}), cb0\[9\]\.[xyzw]{4}, (?P<FIXREG1X>r\d+)\.(?P<FIXSWIZZx>[xyzw]{1})(?P=FIXSWIZZx)(?P=FIXSWIZZx)(?P=FIXSWIZZx), r\d+\.[xyzw]{4}\n
\s*add r\d+\.([xyzw]{3}|[xyzw]{4}), r\d+\.[xyzw]{4}, cb0\[10\]\.[xyzw]{4}\n
)

[ShaderRegexPSShadows5LOSTI.Pattern.Replace]
\n
${section1}\n
${rest}\n
//ShaderRegEx - Pattern 5 - PS-Shadows_5 by Losti START\n
ld_indexable(texture2d)(float,float,float,float) ${stereo}.xyzw, l(0, 0, 0, 0), t125.xyzw\n
//using CB0[25] from PS, if its not zero\n
ieq ${tmp1}.y, cb0[25].z, l(0.0000000)\n
if_z ${tmp1}.y\n
add ${stereo}.w, -${FIXREG1X}.${FIXSWIZZx}, -${stereo}.y\n
mul ${stereo}.w, ${stereo}.w, ${stereo}.x\n
div ${tmp1}.x, -cb0[25].x, cb0[25].z\n
mul ${stereo}.w, ${stereo}.w, ${tmp1}.x\n
add ${FIXREG0Z}.${FIXSWIZZz}, ${FIXREG0Z}.${FIXSWIZZz}, -${stereo}.w\n
endif\n
//if CB0[25]=0 its using the CB0[1] from VS\n
if_nz ${tmp1}.y\n
add ${stereo}.w, -${FIXREG1X}.${FIXSWIZZx}, -${stereo}.y\n
mul ${stereo}.w, ${stereo}.w, ${stereo}.x\n
div ${tmp1}.x, -cb13[1].x, cb13[1].z\n
mul ${stereo}.w, ${stereo}.w, ${tmp1}.x\n
add ${FIXREG0Z}.${FIXSWIZZz}, ${FIXREG0Z}.${FIXSWIZZz}, -${stereo}.w\n
endif\n
//ShaderRegEx - Pattern 5 - PS-Shadows_5 by Losti END\n\n
${section2}
[ShaderRegexPSShadows5LOSTI.InsertDeclarations]
dcl_constantbuffer cb13[10], immediateIndexed
dcl_resource_texture2d (float,float,float,float) t125
;********************************************************PS-Shadows-5***************************************************************
;
;
;********************************************************VS-Shadows-1************************************************************
;VS-Shadows1-LOSTI
[ShaderRegexVSSHADOWS1]
shader_model = vs_4_0 vs_5_0
temps = stereo tmp1
[ShaderRegexVSSHADOWS1.Pattern]
(?P<section1>
