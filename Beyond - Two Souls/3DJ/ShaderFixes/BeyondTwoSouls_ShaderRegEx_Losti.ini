)
(?s)(?P<rest1>.*)
(?P<section2>
\s*add o(?P<OUTPUT0>\d+)(?P<OUTPUT0OPERATION>\.(?P<OUTPUT0SWIZZLE>[xyzw]{4}), r\d+\.[xyzw]{4}, cb0\[3\]\.[xyzw]{4})\n
)
[ShaderRegexVSSHADOWS1.Pattern.Replace]
${section1}
${rest1}
${section2}
\n
//ShaderRegEx - Pattern 16 - VS-SHADOWS_1 by Losti START\n
ld_indexable(texture2d)(float,float,float,float) ${stereo}.xyzw, l(0, 0, 0, 0), t125.xyzw\n
add ${tmp1}${OUTPUT0OPERATION}\n
add ${stereo}.w, ${tmp1}.w, -${stereo}.y\n
mul ${stereo}.w, ${stereo}.w, ${stereo}.x\n
add ${tmp1}.x, ${tmp1}.x, ${stereo}.w\n
mov o${OUTPUT0}.${OUTPUT0SWIZZLE}, ${tmp1}.${OUTPUT0SWIZZLE}\n
//ShaderRegEx - Pattern 16 - VS-SHADOWS_1 by Losti END\n\n
[ShaderRegexVSSHADOWS1.InsertDeclarations]
dcl_resource_texture2d (float,float,float,float) t125
//disable stereo driver automatic correction by declaration of cb12
dcl_constantbuffer cb12[4], immediateIndexed
